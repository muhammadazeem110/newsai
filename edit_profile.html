<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Strategic Intel</title>
    <style>
        /* --- General Reset & Font --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar (Dark Theme) --- */
        .sidebar {
            width: 280px;
            background-color: #111827; /* Dark Navy/Black */
            color: white;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 600;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .new-chat-btn {
            background: linear-gradient(90deg, #2563eb, #a855f7);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            text-align: left;
            padding-left: 20px;
        }

        .sidebar-section {
            margin-top: 20px;
        }

        .sidebar-title {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #d1d5db;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .sidebar-item:hover {
            background-color: #1f2937;
        }

        /* --- Main Content Area --- */
        .main-content {
            flex: 1;
            padding: 40px 60px;
            overflow-y: auto;
        }

        .page-header {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-icon {
            width: 50px;
            height: 50px;
            background-color: #dbeafe;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        .page-header h1 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .page-header p {
            color: #6b7280;
            font-size: 16px;
        }

        /* --- Edit Profile Card --- */
        .card {
            background-color: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            max-width: 800px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .card-header-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background-color: #dbeafe;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .card-header h2 {
            font-size: 20px;
            color: #1f2937;
        }

        .card-header p {
            color: #6b7280;
            font-size: 14px;
        }

        /* --- Form Layout --- */
        .avatar-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .avatar-large {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
        }

        .change-avatar-btn {
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 10px 16px;
            border-radius: 8px;
            color: #374151;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .change-avatar-btn:hover {
            background-color: #e5e7eb;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-col {
            flex: 1;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            color: #1f2937;
            background-color: white;
            outline: none;
            transition: 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input[readonly] {
            background-color: #f9fafb;
            color: #9ca3af;
            cursor: not-allowed;
            border: 1px solid #e5e7eb;
        }

        /* --- Buttons --- */
        .form-actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: transparent;
            color: #6b7280;
            padding: 12px 24px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            background-color: #f3f4f6;
            color: #1f2937;
        }
    </style>
</head>
<body>

    <!-- Sidebar (Styling matched to image) -->
    <div class="sidebar">
        <div class="brand">
            <div class="brand-logo">🧠</div>
            <span>Strategic Intel</span>
        </div>
        
        <button class="new-chat-btn">+ New Intelligence Chat</button>

        <div class="sidebar-section">
            <div class="sidebar-title">Today</div>
            <div class="sidebar-item">📄 Global Technology Disr...</div>
            <div class="sidebar-item">📄 Pakistan Economic Out...</div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-title">Yesterday</div>
            <div class="sidebar-item">📄 Cybersecurity Threats ...</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="page-header">
            <div class="header-icon">AA</div>
            <div>
                <h1>Edit Profile</h1>
                <p>Update your personal information details</p>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-header-icon">✏️</div>
                <div>
                    <h2>Profile Information</h2>
                    <p>Make changes to your account details below</p>
                </div>
            </div>

            <form action="#" method="POST">
                <!-- Avatar Edit -->
                <div class="avatar-section">
                    <div class="avatar-large">JD</div>
                    <button type="button" class="change-avatar-btn">Change Profile Picture</button>
                </div>

                <!-- Name -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" value="Ahsaan Nawaz">
                </div>

                <!-- Email & Role (Role is readonly like in screenshot) -->
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" value="1235@intelligence.ai">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label for="role">Role</label>
                            <input type="text" id="role" name="role" value="Intelligence Analyst" readonly>
                            <small style="color: #9ca3af; font-size: 12px;">(Role cannot be edited)</small>
                        </div>
                    </div>
                </div>

                <!-- Bio / Additional Info -->
                <div class="form-group">
                    <label for="bio">Short Bio</label>
                    <textarea id="bio" name="bio" rows="4" placeholder="Write a short description about yourself...">Senior Intelligence Analyst specializing in global tech trends and security.</textarea>
                </div>

                <!-- Actions -->
                <div class="form-actions">
                    <!-- This button takes you back to settings.html -->
                    <button type="button" class="btn-secondary" onclick="window.location.href='setting.html'">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
